name = "phoenix-fox-relay"
main = "src/index.ts"
compatibility_date = "2026-11-14"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[observability.traces]
enabled = true

[vars]
APNS_BUNDLE_ID = "com.cinderandcrown.phoenixfox"
# TestFlight and developer builds use the sandbox push host. Set this to "false" for a store build.
APNS_USE_SANDBOX = "true"

# RELAY_TOKEN, APNS_KEY_P8, APNS_KEY_ID, and APPLE_TEAM_ID are wrangler secrets.
# They are not written here.

[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]
