name: CI

# Unsigned iOS Simulator build. Proves Phoenix Fox compiles. No Apple account required.
# Signing and TestFlight are in testflight.yml and stay skipped until the secrets exist.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  # xcodebuild reads this the same way the Xcode defaults key does. Prebuilt
  # swift-syntax has no iOS simulator slice, so macros must build from source.
  IDEPackageEnablePrebuilts: "NO"

jobs:
  build:
    name: Simulator build (unsigned)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Config files for compile
        run: |
          cp Config.xcconfig.example Config.xcconfig
          cp OpenVision/Config/Config.swift.example OpenVision/Config/Config.swift
          # Empty client token is enough to compile. The real token is a secret.
          sed -i '' 's/^DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = /' Config.xcconfig

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('PhoenixFox.xcodeproj/project.pbxproj', 'project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Disable SwiftPM prebuilts (swift-syntax prebuilts lack iOS slices)
        run: |
          defaults write com.apple.dt.Xcode IDEPackageEnablePrebuilts -bool NO
          rm -rf .spm/prebuilts
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm/prebuilts"

      - name: Build for simulator
        run: |
          set +e
          xcodebuild build-for-testing \
            -project PhoenixFox.xcodeproj \
            -scheme PhoenixFox \
            -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            -clonedSourcePackagesDirPath .spm \
            -derivedDataPath DerivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            > "$RUNNER_TEMP/xcodebuild.log" 2>&1
          status=$?
          set -e
          xcbeautify --renderer github-actions < "$RUNNER_TEMP/xcodebuild.log" || true
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -E '/(OpenVision|OpenVisionTests)/[^:]+\.swift:[0-9]+:[0-9]+: warning:' "$RUNNER_TEMP/xcodebuild.log"; then
            echo "::error::Phoenix Fox sources produced warnings. Strict concurrency is on. Fix the lines above."
            exit 1
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-logs
          path: DerivedData/Logs/Build/*.xcactivitylog
          if-no-files-found: ignore
